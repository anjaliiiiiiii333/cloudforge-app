apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudforge-app
  template:
    metadata:
      labels:
        app: cloudforge-app
    spec:
      containers:
        - name: cloudforge-app
          image: ghcr.io/anjaliiiiiiii333/cloudforge-app:2dc8b2b39108b99a4841f68fb5c635d4140d8419
          ports:
            - containerPort: 5000