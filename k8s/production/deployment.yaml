apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudforge-app
  template:
    metadata:
      labels:
        app: cloudforge-app
    spec:
      containers:
        - name: cloudforge-app
          image: ghcr.io/anjaliiiiiiii333/cloudforge-app:9b0ba56e57ef27dfc63a41b6587c964c095e90e7
          ports:
            - containerPort: 5000
