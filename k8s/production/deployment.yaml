apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudforge-app
  template:
    metadata:
      labels:
        app: cloudforge-app
    spec:
      containers:
        - name: cloudforge-app
          image: ghcr.io/anjaliiiiiiii333/cloudforge-app:84e1e36c9a64a848a0e071e866ae3c4432c0a8a2
          ports:
            - containerPort: 5000