apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudforge-app
  template:
    metadata:
      labels:
        app: cloudforge-app
    spec:
      containers:
        - name: cloudforge-app
          image: ghcr.io/anjaliiiiiiii333/cloudforge-app:e5f707a5910b6692e4a61a646a9a55b151733a05
          ports:
            - containerPort: 5000